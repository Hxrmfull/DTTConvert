name: Feature request / Пожелание
description: A new platform, preset, format or improvement / Новая площадка, пресет, формат или улучшение
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd like / Что хотелось бы
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What for / Зачем
      description: For a platform preset, a link to its official requirements helps a lot / Для пресета площадки очень поможет ссылка на её официальные требования
